name: QA DMG

# Fork-only QA builds signed with the owner's Developer ID identity and notarized.
# Dispatched by Scripts/qa.sh (per-PR builds and the all-features `my-tip`).
# The workflow and scripts live only on the fork's default branch (`qa-tools`);
# the source ref is checked out separately and built with that tooling.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
      label:
        description: Artifact label (defaults to the sanitized ref)
        required: false

run-name: QA DMG ${{ inputs.label || inputs.ref }}

concurrency:
  group: qa-dmg-${{ inputs.label || inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner == 'dsebban'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Resolve label
        id: source
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          label="$(printf '%s' "${INPUT_LABEL:-$INPUT_REF}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Check out QA tooling
        uses: actions/checkout@v6
        with:
          path: tooling
          persist-credentials: false

      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: source/.build
          key: ${{ runner.os }}-${{ runner.arch }}-qa-release-${{ hashFiles('source/Package.swift', 'source/Package.resolved', 'source/Vendor/Codex/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-qa-release-

      - name: Prepare protected release tooling
        id: release-tooling
        env:
          QA_RELEASE_PATCH_BASE64: ${{ secrets.QA_RELEASE_PATCH_BASE64 }}
          QA_RELEASE_RUNNER_BASE64: ${{ secrets.QA_RELEASE_RUNNER_BASE64 }}
        run: |
          set -euo pipefail
          : "${QA_RELEASE_PATCH_BASE64:?QA_RELEASE_PATCH_BASE64 is required}"
          : "${QA_RELEASE_RUNNER_BASE64:?QA_RELEASE_RUNNER_BASE64 is required}"
          patch="$RUNNER_TEMP/qa-release.patch"
          runner="$RUNNER_TEMP/qa-release-runner.sh"
          printf '%s' "$QA_RELEASE_PATCH_BASE64" | base64 --decode > "$patch"
          git -C source apply --check "$patch"
          git -C source apply "$patch"
          printf '%s' "$QA_RELEASE_RUNNER_BASE64" | base64 --decode > "$runner"
          chmod 700 "$runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      - name: Build and notarize Developer ID QA DMG
        id: dmg
        env:
          DEVID_P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          DEVID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVID_PROVISIONING_PROFILE_BASE64 }}
          DEVID_SIGN_IDENTITY: ${{ vars.DEVID_SIGN_IDENTITY }}
          DEVID_TEAM_ID: ${{ vars.DEVID_TEAM_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          QA_OUTPUT_DIR: ${{ runner.temp }}/qa
        run: |
          "${{ steps.release-tooling.outputs.runner }}" "${{ steps.source.outputs.label }}" source

      - name: Upload QA DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.dmg }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
